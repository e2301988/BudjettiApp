<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudjettiApp</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <header>
            <h1>BudjettiApp</h1>
            <p>Seuraa helposti omia tulojasi ja menojasi.</p>
        </header>

        <section class="summary">
            <div class="summary-card">
                <h2>Tulot</h2>
                <p id="totalIncome">0,00 €</p>
            </div>

            <div class="summary-card">
                <h2>Menot</h2>
                <p id="totalExpenses">0,00 €</p>
            </div>

            <div class="summary-card">
                <h2>Saldo</h2>
                <p id="balance">0,00 €</p>
            </div>
        </section>

        <section class="budget-section">
            <h2>Kuukausibudjetti</h2>
            <p id="budgetMonth"></p>

            <form id="budgetForm">
                <label for="monthlyBudget">Kuukauden menoraja (€)</label>
                <input
                    type="number"
                    id="monthlyBudget"
                    min="0.01"
                    step="0.01"
                    placeholder="Esim. 800"
                    required
                >
                <button type="submit">Tallenna budjetti</button>
            </form>

            <div class="budget-details">
                <p>Budjetti: <strong id="budgetAmount">0,00 €</strong></p>
                <p>Käytetty: <strong id="budgetSpent">0,00 €</strong></p>
                <p>Jäljellä: <strong id="budgetRemaining">0,00 €</strong></p>
            </div>

            <div class="progress-bar">
                <div id="budgetProgress"></div>
            </div>

            <p id="budgetMessage"></p>
        </section>

        <section class="form-section">
            <h2>Lisää tapahtuma</h2>

            <form id="transactionForm">
                <label for="description">Kuvaus</label>
                <input
                    type="text"
                    id="description"
                    placeholder="Esim. Ruokaostokset"
                    required
                >

                <label for="amount">Summa (€)</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Esim. 25"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="type">Tapahtuman tyyppi</label>
                <select id="type">
                    <option value="expense">Meno</option>
                    <option value="income">Tulo</option>
                </select>

                <label for="category">Kategoria</label>
                <select id="category">
                    <option value="Ruoka">Ruoka</option>
                    <option value="Asuminen">Asuminen</option>
                    <option value="Liikenne">Liikenne</option>
                    <option value="Palkka">Palkka</option>
                    <option value="Vapaa-aika">Vapaa-aika</option>
                    <option value="Muu">Muu</option>
                </select>

                <button type="submit">Lisää tapahtuma</button>
            </form>
        </section>

        <section class="transactions-section">
            <h2>Tapahtumat</h2>

            <div class="filter-section">
                <label for="categoryFilter">Suodata kategorian mukaan</label>
                <select id="categoryFilter">
                    <option value="all">Kaikki kategoriat</option>
                    <option value="Ruoka">Ruoka</option>
                    <option value="Asuminen">Asuminen</option>
                    <option value="Liikenne">Liikenne</option>
                    <option value="Palkka">Palkka</option>
                    <option value="Vapaa-aika">Vapaa-aika</option>
                    <option value="Muu">Muu</option>
                </select>
            </div>

            <ul id="transactionList"></ul>
        </section>
    </main>
</body>
</html>
